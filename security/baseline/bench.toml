# Per-section budgets for the host-hardening scanners. Read by the exporter AT SCRAPE TIME.
#
# WHY BUDGETS AND NOT ZERO. Lynis and docker-bench both report dozens of things that nobody will
# ever act on for this fleet: auditd rule sets, per-container AppArmor profiles, user namespace
# remapping, GRUB passwords on a VPS with no console. Alerting on the absolute count would mean a
# permanently red security stream, and a stream that is always red is worth less than none — it
# trains you to filter the folder that also carries InternalTlsNotRenewing.
#
# So the alert fires on REGRESSION: findings above the budget committed here. The budget is the
# count observed when the machine was last reviewed and accepted. Raising a budget is an explicit,
# reviewable diff that says "we looked at this and accepted it"; the number going up on its own is
# what pages you.
#
# Workflow for a new machine:
#   1. install and run once
#   2. scripts/secaudit.sh baseline-init      -> prints the observed counts
#   3. review them, paste them here, commit
# Anything with no entry falls back to [defaults], which is deliberately generous: a new host must
# not page on day one, before anyone has looked at it.
# NOTE: image CVE budgets used to live here. They moved to the application's CI on 2026-09-08
# (docs/CI-IMAGE-SCANNING.md) — the fix is a repository change, so the gate belongs at the build.
# What the fleet checks now is image AGE, and its threshold is in the alert rule rather than here,
# because it is one number for the whole fleet rather than a per-host accepted count.
schema = 1

# Fallback for any (host, section) with no explicit entry below.
[defaults]
lynis_warning = 5
lynis_suggestion = 60
bench = 60

# ---------------------------------------------------------------------------------------------
# Observed and accepted on 2026-09-06. These are starting points, not targets: the intent is that
# they ratchet DOWN as findings get fixed, and any increase is a regression.
#   manager        lynis index 68, 1 warning, 41 suggestions, docker-bench 33 failures of 117
#   segcore-demo   lynis index 65, 2 warnings, 40 suggestions, docker-bench 33 failures of 117
# ---------------------------------------------------------------------------------------------
[hosts.manager]
lynis_warning = 2
lynis_suggestion = 45
bench = 35

[hosts."segcore-demo"]
lynis_warning = 3
lynis_suggestion = 45
bench = 35
