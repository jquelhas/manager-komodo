# Headscale — coordenador WireGuard do control plane (manager-komodo)
# Versão-alvo: headscale v0.29.2. Corre como container; o cliente Tailscale corre no host.

# URL público a que os clientes Tailscale se ligam (via Traefik, entrypoint público).
server_url: https://komodo.segcore.eu

# Bind interno (só rede Docker; Traefik termina o TLS e faz proxy para aqui).
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090        # não publicado no host; scrape via mesh mais tarde
grpc_listen_addr: 127.0.0.1:50443        # CLI usa o unix socket local; gRPC remoto desligado

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Espaço de IPs da mesh (decisão baseline: 100.64.0.0/16, CGNAT, sem risco de colisão).
# allocation: sequential → o primeiro node (o manager) recebe 100.64.0.1, como o design assume.
prefixes:
  v4: 100.64.0.0/16
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# DERP: sem servidor embebido; usa o mapa público da Tailscale como fallback de relay.
# O plano de dados tenta primeiro ligação directa via 41641/udp.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# MagicDNS: base_domain apps.internal; search domain apps.internal empurrado para todos os nodes.
# Nodes resolvem <hostname>.apps.internal. Registos de serviço (grafana/komodo/vm/step-ca →
# 100.64.0.1) são acrescentados em extra_records num passo posterior.
dns:
  magic_dns: true
  base_domain: apps.internal
  # FALSE = split DNS: só o que está sob base_domain (incluindo os extra_records abaixo) vai ao
  # 100.100.100.100; todo o resto fica com o resolver próprio da máquina. É o que se quer num
  # portátil de operador, que tem o seu DNS de casa/escritório e não o deve perder por estar ligado
  # à mesh.
  #
  # O mapeamento não é óbvio, está em hscontrol/types/config.go (dnsToTailcfgDNS):
  #   true  -> nameservers.global vai para cfg.Resolvers         = assume TODO o DNS do cliente
  #   false -> nameservers.global vai para cfg.FallbackResolvers = só se o SO não tiver nenhum
  # Em qualquer dos casos o MagicDNS (cfg.Proxied) continua a tratar o base_domain, por isso
  # *.apps.internal resolve na mesma. No systemd-resolved a diferença vê-se em `resolvectl status`:
  # com true o link tailscale0 leva o domínio de routing "~." (catch-all), com false leva só
  # "apps.internal".
  #
  # Seguro para os hosts: manager, segcore-demo e segcore-host1 correm todos systemd-resolved com
  # resolver próprio no link (verificado 2026-09-14), e os containers nunca usaram MagicDNS -- é
  # por isso que o step-ca precisa dos extra_hosts no docker-compose.yml.
  #
  # CHECK THIS PER HOST, not once for the fleet. "Has a resolver on the link" is what makes the
  # split safe, and it is exactly what nobody re-checks after a reinstall or a DHCP change. The
  # check is `resolvectl status` on the host: the physical link must carry DNS servers of its own.
  # A host that lost them does not fail loudly -- it quietly falls through to the fallback below.
  override_local_dns: false
  nameservers:
    # OVH's resolver, NOT 1.1.1.1/1.0.0.1. Those are unreachable for DNS from this fleet, and a
    # fallback that cannot answer is worse than no fallback: it turns "this node has no resolver"
    # into SERVFAIL on every public name.
    #
    # WHY. There is no host firewall; the external OVH firewall is the authoritative gate (see
    # security/baseline/ports.toml) and it is STATELESS, with the allowlist 443/tcp, 41641/udp,
    # 60022/tcp. A public resolver answers over UDP to an ephemeral port, which is not on that
    # list, so the reply is dropped. The resolver is not blocked and the host is not offline --
    # only the UDP return path is gone. Measured from the manager, 2026-09-19:
    #
    #   1.1.1.1              ping OK, TCP/53 NOERROR, HTTPS 301, but UDP/53 times out
    #   1.0.0.1, 8.8.8.8, 9.9.9.9, 208.67.222.222    UDP/53 times out
    #   213.186.33.99 (OVH)  UDP/53 answers
    #
    # What it cost before it was found: tailscaled forwards to these resolvers over UDP, so
    # `dig @100.100.100.100 registry-1.docker.io` returned SERVFAIL. A node that fell back to the
    # mesh for a public name had no public DNS at all, and `docker pull` on it failed with
    # "lookup registry-1.docker.io on 127.0.0.53:53: server misbehaving" -- which the app's
    # scripts/update.sh reported as an invalid domain configuration, pointing the operator at the
    # wrong file entirely (segcore-demo, 2026-09-19).
    #
    # Reached only by a client with NO resolver of its own, because override_local_dns is false
    # above. An operator laptop outside OVH keeps its own DNS and never lands here; if one ever
    # does, 213.186.33.99 is reachable from OVH networks only, so it fails visibly instead of
    # silently. Changing provider means changing this line -- it is not a public resolver.
    #
    # DO NOT TREAT THIS AS A SAFETY NET. Measured on the manager after this value was changed and
    # confirmed delivered (`sudo tailscale debug netmap` shows FallbackResolvers = 213.186.33.99):
    # a direct `dig @100.100.100.100 example.com` still returns SERVFAIL. `tailscale dns status`
    # explains why -- "reading the system DNS configuration is not supported on this platform", so
    # the client never concludes the OS is resolver-less and never engages the fallback. With
    # cfg.Resolvers empty (which is what override_local_dns: false buys us), MagicDNS answers
    # apps.internal and SERVFAILs everything else, whatever is written here.
    #
    # So this line fixes a value that could never have worked; it does not make the mesh a usable
    # resolver of last resort. The load-bearing requirement is the one stated above
    # override_local_dns: every host keeps a working resolver on its own physical link. A host
    # that loses it has no public DNS, and no setting in this file will save it.
    global:
      - 213.186.33.99
  # VAZIO DE PROPÓSITO. O base_domain já entra sozinho na lista de search domains que vai para o
  # cliente -- o Headscale faz (hscontrol/types/config.go, dnsToTailcfgDNS):
  #     cfg.Domains = []string{dns.BaseDomain}
  #     cfg.Domains = append(cfg.Domains, dns.SearchDomains...)
  # Declarar "apps.internal" aqui outra vez duplicava-o, e via-se no cliente: o
  # `tailscale dns status` listava "apps.internal" duas vezes em Search Domains (2026-09-14).
  # Era inofensivo, mas não há razão para o manter. Acrescentar aqui apenas domínios de pesquisa
  # ADICIONAIS, que não o base_domain.
  search_domains: []
  # Registos de serviço → IP do manager (100.64.0.1). Todos os serviços de gestão vivem no
  # manager atrás do entrypoint interno do Traefik. Acrescentar aqui à medida que sobem.
  extra_records:
    - name: "step-ca.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "vm.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "grafana.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "komodo.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "headplane.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "tailscale.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "home.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "alertmanager.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "vmalert.apps.internal"
      type: "A"
      value: "100.64.0.1"
    - name: "pghero.apps.internal"
      type: "A"
      value: "100.64.0.1"

# Política de acessos (ACLs) versionada em ficheiro.
policy:
  mode: file
  path: /etc/headscale/acl.hujson

log:
  level: info
