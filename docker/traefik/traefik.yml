## Traefik static configuration — manager-komodo control plane (Passo 4.1)
## Dual entrypoint: público (Let's Encrypt) + interno (step-ca, activado no passo da mesh).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Dashboard OFF — nada interno é publicado ainda; não expor publicamente.
api:
  dashboard: false

entryPoints:
  # PÚBLICO: publicado no host como 0.0.0.0:443 (ver docker-compose). Serve komodo.segcore.eu.
  websecure-public:
    address: ":443"
  # INTERNO: escuta 0.0.0.0:8443 DENTRO do container apenas.
  # NÃO publicado no host ao 4.1 (o IP Tailscale 100.64.0.1 ainda não existe).
  # DEPOIS: acrescentar o port-publish "100.64.0.1:443:8443" no docker-compose.yml — sem tocar aqui.
  websecure-internal:
    address: ":8443"
  # REDIRECT INTERNO: escuta :80 dentro do container, publicado só em 100.64.0.1:80 (ver
  # docker-compose.yml). Não serve router nenhum — só redirecciona para HTTPS.
  #
  # Porque existe: escrever `http://home.apps.internal` dá "connection refused", sem pista nenhuma,
  # num nome que resolve e num serviço que está de pé. Custou duas sessões de diagnóstico (2026-09-19
  # e 2026-10-14) à mesma pessoa que escreveu isto. Vale para todas as UIs internas, não só a
  # Homepage.
  #
  # `to: ":443"` E NÃO `to: websecure-internal`, que é a forma óbvia e está errada. O
  # RedirectEntryPoint do Traefik v3.7 não tem campo `port` (pkg/config/static/entrypoints.go: só
  # To, Scheme, Permanent, Priority), por isso apontar ao NOME do entrypoint faz o redirect herdar
  # a porta dele — :8443, que é onde escuta dentro do container e não onde está publicado. O browser
  # ia parar a https://host:8443 e falhava. A documentação diz que o alvo "can be an entry point
  # name (ex: websecure), or a port (:443)", e é a segunda forma que serve aqui.
  web-internal:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: ":443"
          scheme: https
          permanent: true
  # NOTA: o :80 acima NÃO é público. A allowlist da firewall externa continua a ser 443/tcp,
  # 41641/udp e 60022/tcp, e o TLS-ALPN-01 do entrypoint público continua a só precisar do 443.

certificatesResolvers:
  # ---- PÚBLICO: Let's Encrypt via TLS-ALPN-01 (só 443, sem porto 80, sem API DNS) ----
  le:
    acme:
      email: "admin@segcore.eu"
      storage: /certs/acme-le.json
      # Staging validado (2026-07-14); agora produção.
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      caServer: https://acme-v02.api.letsencrypt.org/directory
      tlsChallenge: {}

  # ---- INTERNO: step-ca ACME (CONFIGURADO agora, exercitado num passo posterior) ----
  stepca:
    acme:
      email: "admin@segcore.eu"
      storage: /certs/acme-stepca.json
      caServer: https://step-ca:9000/acme/acme/directory   # DNS da rede Docker
      # Traefik tem de CONFIAR na raiz do step-ca para falar ACME sobre HTTPS.
      # Este PEM é copiado do volume do step-ca após o primeiro arranque (ver bring-up).
      caCertificates:
        - /certs/step-ca-root.crt
      tlsChallenge: {}   # step-ca valida via TLS-ALPN-01 no websecure-internal (mais tarde)
      # step-ca issues 24h certificates; Traefik defaults to 2160 (90 days). The value is used
      # ONLY to derive the renewal schedule (getCertificateRenewDurations), and the default lands
      # on "renew when < 30 days remain, retry once every 24 hours" -- so the single daily attempt
      # fired seconds before expiry (measured 2026-09-12: renewed 23:06:52, expiry 23:07:01), and
      # ONE failed attempt would leave every *.apps.internal on an expired certificate for a full
      # day. At 24 the schedule becomes "renew when < 6 hours remain, retry every 10 minutes":
      # six hours of margin and ~36 attempts instead of one.
      # Keep this number equal to the lifetime step-ca actually issues (ACME provisioner
      # defaultTLSCertDuration in its ca.json) -- raising one without the other re-narrows the margin.
      certificatesDuration: 24

providers:
  docker:
    # Read-only Docker API via socket-proxy (no raw docker.sock mounted in Traefik).
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: manager-komodo
  file:
    directory: /etc/traefik/dynamic
    watch: true
