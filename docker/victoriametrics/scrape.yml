# VictoriaMetrics scrape configuration (Prometheus format).
# Passed to VM via -promscrape.config; VM hot-reloads on change
# (-promscrape.configCheckInterval). GIMS app-host targets are discovered dynamically via
# http_sd from the provisioning service, which derives them from the Komodo server list — a
# host is scraped as soon as it's a Komodo Server and drops off when removed (no manual targets).
global:
  scrape_interval: 15s

scrape_configs:
  # Self-monitoring of the control plane's own metrics stack.
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']

  - job_name: 'vmalert'
    static_configs:
      - targets: ['vmalert:8880']

  # GIMS app hosts — discovered from the Komodo server list via the provisioning service.
  - job_name: 'gims-backend'
    metrics_path: /metrics
    scrape_interval: 10s
    http_sd_configs:
      - url: 'http://provisioning:8000/sd/gims/backend'

  - job_name: 'gims-postgresql'
    http_sd_configs:
      - url: 'http://provisioning:8000/sd/gims/postgresql'

  # Per-container metrics — one central exporter on the provisioning service that translates the
  # per-container stats Komodo/Periphery already collects (read/ListDockerContainers) into Prometheus.
  # No agent on the hosts. One target; the exporter fans out to every Komodo server internally.
  - job_name: 'komodo-containers'
    scrape_interval: 30s
    scrape_timeout: 20s
    metrics_path: /metrics/containers
    static_configs:
      - targets: ['provisioning:8000']

  # Security auditor — the same central-exporter shape as komodo-containers, but reading local
  # state files instead of the Komodo API. Its own job_name so up{job="security"} is meaningful.
  # Re-timestamping day-old findings on every scrape is the intended semantics: current findings
  # stay current until a scan supersedes them, and freshness travels separately in
  # secaudit_scan_last_success_timestamp_seconds.
  - job_name: 'security'
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /metrics/security
    static_configs:
      - targets: ['provisioning:8000']
