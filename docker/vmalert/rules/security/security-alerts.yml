# Security auditor ALERTING rules — evaluated by vmalert, sent to Alertmanager.
# Metrics come from provisioning:8000/metrics/security (job "security"). See docs/plan/secaudit.md.
#
# Two conventions that must not be "tidied up" later:
#
#  1. Every rule carries `scope: secaudit` and NONE carries `app: segcore`. The deploy Procedure
#     silences Alertmanager on the matcher app="segcore" for 30 minutes on every deploy
#     (the app's scripts/update.sh, via /maintenance/silence). Labelling these alerts app="segcore" would
#     blind the security stream during exactly the window when a new image lands.
#
#  2. Every finding rule filters suppressed="0". A suppression in security/suppressions.toml does
#     not hide a finding — it relabels it suppressed="1", so it stays on the dashboard and keeps
#     being exported. Only the alerting path honours it.
#
# `for:` with daily/weekly data: between scans the series is CONSTANT (rendered from state), so
# `for` only delays the first notification. When a scan clears a finding the series DISAPPEARS and
# the alert resolves — which is why the exporter must never emit a cleared finding as 0.
groups:
  - name: secaudit_freshness
    interval: 5m
    rules:
      # One rule for every cadence: each scan's own budget travels as a metric, so a 5-minute
      # sensor and a weekly scan are both covered without a rule each.
      - alert: SecurityScanStale
        expr: (time() - secaudit_scan_last_success_timestamp_seconds)
                > on(scan) group_left() secaudit_scan_max_age_seconds
        for: 30m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security scan {{ $labels.scan }} is stale on {{ $labels.host }}"
          description: "No successful run of {{ $labels.scan }} within its budget. A stale scan is NOT a clean scan: the findings shown are old. Check `systemctl status manager-security-fast.service` and run `scripts/secaudit.sh status`."

      - alert: SecurityScanFailing
        expr: secaudit_scan_last_status == 0
        for: 2h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security scan {{ $labels.scan }} is failing on {{ $labels.host }}"
          description: "The last run of {{ $labels.scan }} exited non-zero for 2h. Run it by hand: scripts/secaudit.sh run {{ $labels.scan }}."

      # The single most likely way this whole system quietly dies: it runs, succeeds, and audits
      # nothing.
      - alert: SecurityScanTargetsEmpty
        expr: secaudit_scan_targets < 1
        for: 1h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security scan {{ $labels.scan }} has no targets"
          description: "{{ $labels.scan }} succeeded but covered zero targets — it is auditing nothing."

      - alert: SecurityDiscoveryDegraded
        expr: secaudit_discovery_ok == 0 or secaudit_discovery_shrunk == 1
        for: 1h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security target discovery is degraded"
          description: "Discovery from Komodo failed, or returned far fewer targets than before and kept the cached list. Shrinking coverage must be a deliberate decision: check state/discovery.json for the reason."

      - alert: SecurityExporterDown
        expr: up{job="security"} == 0
        for: 15m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security metrics exporter is down"
          description: "VictoriaMetrics cannot scrape provisioning:8000/metrics/security. Every security alert is blind while this lasts."

      - alert: SecurityStateUnreadable
        expr: secaudit_exporter_state_error == 1
        for: 30m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security state file unreadable: {{ $labels.file }}"
          description: "The exporter could not read or parse {{ $labels.file }}. Findings from it are absent, which must never be read as 'no findings'."

      - alert: SecurityFindingsTruncated
        expr: secaudit_findings_truncated == 1
        for: 30m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Security findings truncated for {{ $labels.family }}"
          description: "{{ $labels.family }} hit the per-family series cap, so findings are being dropped. Usually a degenerate scan — investigate before raising the cap."

  - name: secaudit_perimeter
    interval: 5m
    rules:
      # The fastest signal in the system. `local` means BOUND to a routable address, which on this
      # fleet is not the same as reachable (no host firewall; the external firewall is the gate) —
      # so this is drift detection. The classic trigger is a stray `-p 5432:5432`.
      - alert: UnexpectedExposedBind
        expr: secaudit_port_unexpected{perspective="local",suppressed="0"} == 1
        for: 10m
        labels:
          severity: critical
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.proto }}/{{ $labels.port }} bound to {{ $labels.bind }} and not in the baseline"
          description: "A service is bound to a routable address ({{ $labels.scope }}) on {{ $labels.host }} and is not in security/baseline/ports.toml. Either it should not be published, or the baseline needs an entry (permanent acceptance) or a dated suppression (temporary)."

      - alert: UnexpectedOpenPortPublic
        expr: secaudit_port_unexpected{perspective="public",suppressed="0"} == 1
        for: 15m
        labels:
          severity: critical
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.proto }}/{{ $labels.port }} reachable from the internet"
          description: "An external scan reached {{ $labels.proto }}/{{ $labels.port }} on {{ $labels.host }} and it is not in the baseline. This measures the EXTERNAL FIREWALL allowlist, so it means the firewall permits it."

      # The manager's baseline for the mesh perspective is empty because acl.hujson has no
      # app-host -> manager rule. Anything here is an ACL regression. Do NOT "fix" it by widening
      # the ACL — that destroys the deny-by-default that stops host-to-manager pivoting.
      - alert: UnexpectedOpenPortMesh
        expr: secaudit_port_unexpected{perspective="mesh",suppressed="0"} == 1
        for: 1h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Headscale ACL regression: {{ $labels.proto }}/{{ $labels.port }} open on {{ $labels.host }} over the mesh"
          description: "A mesh scan reached a port that docker/headscale/acl.hujson should deny. Fix the ACL, do not widen the baseline."

      - alert: ExpectedPortClosed
        expr: secaudit_port_missing{suppressed="0"} == 1
        for: 30m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: required port {{ $labels.proto }}/{{ $labels.port }} is not there"
          description: "A port the baseline marks required_tcp was not observed on {{ $labels.host }} ({{ $labels.perspective }} perspective). Either the service is down or it stopped being published."

  - name: secaudit_hardening
    interval: 15m
    rules:
      # Automates steps 2-4 of the internal-service checklist. The `router` direction is the one
      # that caused the 2026-08-23 outage: a step-ca extra_hosts entry with no router behind it can
      # never answer TLS-ALPN-01, and one such entry stalls EVERY internal certificate renewal.
      - alert: InternalNameMisconfigured
        expr: secaudit_internal_name_misconfigured == 1
        for: 1h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Internal name {{ $labels.name }} is missing from {{ $labels.missing }}"
          description: "missing=dns -> add it to dns.extra_records in docker/headscale/config.yaml and restart headscale. missing=stepca_hosts -> add it to the step-ca extra_hosts block in docker-compose.yml. missing=router -> a step-ca extra_hosts entry has NO Traefik router: it can never complete TLS-ALPN-01 and it stalls the whole internal renewal queue. Remove it."

  - name: secaudit_hygiene
    interval: 1h
    rules:
      - alert: SecuritySuppressionInvalid
        expr: secaudit_suppression_invalid == 1
        for: 30m
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Invalid suppression: {{ $labels.kind }}/{{ $labels.key }} ({{ $labels.reason }})"
          description: "This entry in security/suppressions.toml suppresses NOTHING (reason: {{ $labels.reason }}). Somebody probably believes a finding is silenced when it is not. Fix or remove the entry."

      - alert: SecuritySuppressionExpiringSoon
        expr: secaudit_suppression_expiry_timestamp_seconds - time() < 7 * 86400
        for: 6h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Suppression for {{ $labels.kind }}/{{ $labels.key }} expires in under 7 days"
          description: "Owner {{ $labels.owner }} ({{ $labels.ticket }}) accepted this finding until now. Renew it deliberately or fix the underlying issue — it is about to start alerting again."

  - name: secaudit_hosts
    interval: 15m
    rules:
      # NOT enrolled is never an alert. The fleet is enrolled one machine at a time on purpose, and
      # paging about a decision somebody made deliberately is how an alert stream gets filtered
      # into a folder nobody reads. It is a dashboard fact (secaudit_host_enrolled), nothing more.
      - alert: SecurityHostReportStale
        expr: secaudit_report_age_seconds > 129600
        for: 1h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: audit report is over 36h old"
          description: "The host bundle stopped reporting. On the host: systemctl status secaudit-host.timer, then systemctl start secaudit-host.service. A stale report is NOT a clean one."

      - alert: SecurityHostReportPartial
        expr: secaudit_report_partial == 1
        for: 6h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: last audit run was cut short"
          description: "The run was killed before finishing, so the findings are incomplete. Usually the unit's TimeoutStartSec on a slow machine. Check `/opt/secaudit/run.py --summary` on the host."

      - alert: SecurityHostScannerFailing
        expr: secaudit_host_step_error == 1
        for: 24h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: the {{ $labels.tool }} step is failing"
          description: "One scanner has failed for a day. The other steps still ran, so this is a coverage gap in {{ $labels.tool }} only."


  - name: secaudit_findings
    interval: 15m
    rules:
      # Fixable is the whole point: alerting on total CVE counts means alerting forever on distro
      # CVEs upstream has no fix for, which is a permanently red stream nobody reads.
      # Image CVEs are NOT alerted here any more. They moved to the application's CI on
      # 2026-09-08 (docs/CI-IMAGE-SCANNING.md): the fix is a base-image tag or a lockfile, both of
      # which live in a repository, and alerting somebody who cannot act is how an alert stream
      # ends up filtered into a folder nobody reads.
      #
      # What the fleet alerts on instead is the question CI cannot answer: is the thing actually
      # RUNNING the thing we think we shipped? An image built long ago has stopped receiving
      # base-layer patches — a pin nobody refreshed, or a deploy that quietly never happened.
      - alert: RunningImageStale
        expr: secaudit_running_image_age_seconds{suppressed="0"} > 180 * 86400
        for: 24h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.image }} was built {{ $value | humanizeDuration }} ago"
          description: "This image backs a running container and has not been rebuilt or repulled in over 180 days, so it has missed every base-layer patch since. Repull the tag and redeploy, or — if the version is pinned deliberately — record that in security/suppressions.toml with a date and an owner. Digest-pinned references are excluded automatically: they cannot be refreshed without changing the pin."

      - alert: PendingVulnerablePackages
        expr: secaudit_packages_vulnerable > 0
        for: 24h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} vulnerable OS package(s)"
          description: "Lynis found packages with known vulnerabilities and a pending update. The auditor never runs apt itself — this is a deliberate operator action."

      # Budgets, not absolutes: both scanners report dozens of things nobody will fix on a VPS.
      # What matters is the number going UP, which means something regressed.
      - alert: LynisFindingsRegression
        expr: secaudit_lynis_findings_over_budget > 0
        for: 12h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: lynis {{ $labels.severity }}s above the committed budget"
          description: "More findings than security/baseline/bench.toml accepts for this host. Either something regressed, or the budget needs a reviewed increase — never a silent one."

      - alert: DockerBenchRegression
        expr: secaudit_bench_failures_over_budget > 0
        for: 12h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: CIS Docker Benchmark failures above budget"
          description: "Same ratchet as lynis: the budget in security/baseline/bench.toml is what was reviewed and accepted."

  - name: secaudit_perimeter_scan
    interval: 15m
    rules:
      # This is the only measurement of the external firewall allowlist. It runs FROM an app host,
      # because a self-scan never leaves the machine and would prove nothing.
      - alert: PerimeterUnexpectedPort
        expr: secaudit_perimeter_port_open{expected="0"} == 1
        for: 30m
        labels:
          severity: critical
          scope: secaudit
        annotations:
          summary: "{{ $labels.target }} ({{ $labels.ip }}): {{ $labels.proto }}/{{ $labels.port }} reachable and not in the baseline"
          description: "Seen from {{ $labels.source_host }}. If target ends in _mesh this is a Headscale ACL regression — fix acl.hujson, never widen the baseline. If it ends in _public the external firewall is letting through something it should not."

      - alert: PerimeterScanStale
        expr: time() - secaudit_perimeter_scan_timestamp_seconds > 172800
        for: 2h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "Perimeter cross-scan has not run in 48h"
          description: "The external firewall allowlist and the app-host -> manager ACL deny are unverified while this is stale. Check secaudit-host.timer on {{ $labels.source_host }}."
      # Periphery is the ONLY channel the manager has to a host, so an agent drifting from the
      # Core is a latent failure in the one path used to fix everything else. On 2026-09-09 a
      # freshly onboarded host came up on 2.2.0 against a Core on 2.3.2 and it was found by
      # accident, because nothing measured this.
      #
      # `for: 6h` and not minutes: upgrading the Core legitimately puts every host in mismatch
      # until they are upgraded too, and that is normal for the length of a maintenance session.
      # Six hours is long enough not to page during one, short enough to surface within the day.
      # With the scope="secaudit" route's 24h repeat_interval, a mismatch left unfixed is one
      # e-mail a day, which is the right pressure for "your agents disagree with your Core".
      - alert: PeripheryVersionMismatch
        expr: secaudit_agent_version_matches_core == 0
        for: 6h
        labels:
          severity: warning
          scope: secaudit
        annotations:
          summary: "{{ $labels.host }}: Periphery version does not match the Core"
          description: "Versions are in secaudit_agent_version_info. Upgrade on the host: fetch scripts/setup-periphery.py for the Core's version, run it with --version and --connect-as <host>, then systemctl restart periphery. A version that cannot be read counts as a mismatch, not as a match."
