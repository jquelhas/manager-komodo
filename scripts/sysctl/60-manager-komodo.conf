# manager-komodo host tuning. Install with:
#   sudo cp scripts/sysctl/60-manager-komodo.conf /etc/sysctl.d/ && sudo sysctl --system
#
# WHY ip_nonlocal_bind: Traefik publishes two entrypoints, the public one on ${PUBLIC_IP}:443 and
# the internal one on 100.64.0.1:443 (the host's Tailscale address). 100.64.0.1 only exists once
# tailscaled has logged in — and tailscaled logs in through Headscale, which sits BEHIND Traefik on
# 443. That is a circular dependency, and on a cold boot it deadlocks:
#
#   tailscaled has no session -> 100.64.0.1 does not exist
#     -> Docker cannot bind 100.64.0.1:443 -> Traefik refuses to start
#       -> nothing listens on :443 -> tailscaled can never reach the coordination server
#
# It bit us on 2026-09-06 after a reboot: every internal service was unreachable and the mesh was
# down, with the only symptom being "cannot assign requested address" in the Traefik start error.
#
# ip_nonlocal_bind lets Traefik bind an address that does not exist yet. It starts, :443 comes up,
# tailscaled logs in, the address appears on tailscale0, and the already-bound socket starts
# serving. This is the same mechanism keepalived and other failover setups rely on, and it breaks
# the deadlock permanently instead of requiring an operator to untangle it by hand.
net.ipv4.ip_nonlocal_bind = 1
